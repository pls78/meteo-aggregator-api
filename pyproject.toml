[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meteo-aggregator"
version = "0.1.0"
description = "Accurate local 7-day forecasts by aggregating multiple weather models via Open-Meteo."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["meteo_aggregator", "api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits the real Open-Meteo API (network); skipped unless METEO_LIVE=1",
]

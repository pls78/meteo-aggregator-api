name: CI/CD

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    permissions:
      id-token: write   # required for Workload Identity Federation
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Deploy targets live in repository secrets so this public repo does not
      # advertise the project, service or region — a Cloud Run URL is derivable
      # from those three. Set them with `gh secret set` (see api/README.md).
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        run: |
          # --max-instances and --timeout are cost caps, declared here so they
          # survive a service recreated from scratch. This is a personal-scale
          # deployment: one instance at concurrency 80 is ample, and no request
          # should hold an instance for long. Raise deliberately, not by accident.
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --allow-unauthenticated \
            --max-instances 1 \
            --timeout 20s \
            --set-env-vars ALLOWED_ORIGINS="$ALLOWED_ORIGINS"
        env:
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          REGION: ${{ secrets.CLOUD_RUN_REGION }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
